name: Build Resume PDF

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload generated PDF as artifact'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'resume/**'
      - '.github/workflows/build-resume.yml'

permissions:
  contents: write

jobs:
  build-resume:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile resume LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Copy generated resume PDF to site files
        run: cp resume/resume.pdf files/resume_industry.pdf

      - name: Commit updated resume PDF
        run: |
          if git diff --quiet -- files/resume_industry.pdf; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/resume_industry.pdf
          git commit -m "chore(resume): update compiled PDF [skip ci]"
          git push

      - name: Upload generated PDF artifact (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume_industry
          path: files/resume_industry.pdf
