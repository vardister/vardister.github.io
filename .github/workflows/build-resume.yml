name: Build Resume PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'resume/**'
      - '.github/workflows/build-resume.yml'

permissions:
  contents: read

jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile resume LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Copy generated resume PDF to site files
        run: cp resume/resume.pdf files/resume_industry.pdf

      - name: Upload generated PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume_industry
          path: files/resume_industry.pdf
